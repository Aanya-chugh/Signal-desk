<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL DESK — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Hanken+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0e;--panel:#141417;--panel2:#1b1b20;--line:#29292f;--ink:#ECEAE2;--muted:#8b8b95;--dim:#5c5c64;--accent:#C9F24A;--accent-d:#0c0c0e;--coral:#FF6A45;--gold:#E8B04B;--blue:#6FB7FF;}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',sans-serif;font-size:15px;line-height:1.5;background-image:radial-gradient(circle at 88% -5%,rgba(201,242,74,.07),transparent 45%),radial-gradient(circle at 0% 100%,rgba(111,183,255,.05),transparent 40%);-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:26px 30px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:linear-gradient(180deg,var(--bg),rgba(12,12,14,.92));backdrop-filter:blur(8px);z-index:30}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-family:'Fraunces',serif;font-weight:900;font-size:30px;letter-spacing:-.02em;line-height:.95}
.brand h1 .slash{color:var(--accent)}
.brand .sub{color:var(--muted);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.status{display:flex;gap:22px;align-items:center;text-align:right}
.stat{display:flex;flex-direction:column;gap:1px}
.stat .n{font-family:'JetBrains Mono',monospace;font-size:19px}
.stat .l{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(201,242,74,.6);animation:pulse 2.4s infinite}
.live.syncing .dot{background:var(--gold)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,242,74,.55)}70%{box-shadow:0 0 0 9px rgba(201,242,74,0)}100%{box-shadow:0 0 0 0 rgba(201,242,74,0)}}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 30px;border-bottom:1px solid var(--line);background:var(--panel)}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 13px}
.search input{flex:1;background:none;border:none;color:var(--ink);font-family:inherit;font-size:14px;outline:none}
.search svg{flex-shrink:0;opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:30px;font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap;font-weight:500}
.chip:hover{border-color:var(--dim);color:var(--ink)}
.chip.on{background:var(--accent);color:var(--accent-d);border-color:var(--accent);font-weight:700}
.ctl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
select,.toggle{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 11px;font-family:inherit;font-size:13px;cursor:pointer;outline:none}
.slider-wrap{display:flex;align-items:center;gap:9px}
input[type=range]{accent-color:var(--accent);width:96px}
.toggle{display:inline-flex;align-items:center;gap:8px;user-select:none}
.toggle .sw{width:30px;height:17px;border-radius:20px;background:var(--line);position:relative;transition:.2s}
.toggle .sw::after{content:'';position:absolute;width:13px;height:13px;border-radius:50%;background:var(--muted);top:2px;left:2px;transition:.2s}
.toggle.on .sw{background:var(--coral)}.toggle.on .sw::after{left:15px;background:#fff}
.main{display:grid;grid-template-columns:1fr 432px}
.list{padding:8px 18px 60px;overflow:auto}
.count-line{padding:12px 12px 6px;color:var(--dim);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.card{display:grid;grid-template-columns:64px 1fr;gap:16px;padding:17px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.14s;position:relative}
.card:hover{background:var(--panel)}
.card.sel{background:linear-gradient(90deg,rgba(201,242,74,.09),transparent);box-shadow:inset 3px 0 0 var(--accent)}
.card.fresh{animation:flash 2.5s ease-out}
@keyframes flash{0%{background:rgba(201,242,74,.16)}100%{background:transparent}}
.scorebox{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:2px}
.score{font-family:'JetBrains Mono',monospace;font-size:25px;font-weight:700;line-height:1}
.bar{width:42px;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.slab{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
.card h3{font-family:'Fraunces',serif;font-weight:600;font-size:17px;line-height:1.24;letter-spacing:-.01em;margin-bottom:7px}
.meta{display:flex;flex-wrap:wrap;gap:7px 10px;align-items:center;font-size:11.5px;color:var(--muted)}
.meta .src{color:var(--ink);font-weight:500}
.tag{padding:2px 8px;border-radius:5px;font-size:10.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.tag.niche{background:rgba(111,183,255,.13);color:var(--blue)}.tag.gen{background:var(--panel2);color:var(--dim)}
.tag.fit{background:rgba(201,242,74,.13);color:var(--accent)}.tag.sens{background:rgba(255,106,69,.15);color:var(--coral)}
.tag.new{background:var(--accent);color:var(--accent-d)}
.cat{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--dim)}
.detail{position:sticky;top:103px;height:calc(100vh - 103px);border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:24px 24px 50px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--dim);gap:14px;padding:30px}
.empty .big{font-family:'Fraunces',serif;font-size:21px;color:var(--muted)}
.d-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:9px}
.detail h2{font-family:'Fraunces',serif;font-weight:600;font-size:23px;line-height:1.22;letter-spacing:-.01em;margin-bottom:11px}
.d-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px;font-size:12px;color:var(--muted)}
.d-score{display:flex;align-items:center;gap:16px;padding:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.d-score .big{font-family:'JetBrains Mono',monospace;font-size:42px;font-weight:700;line-height:.9}
.d-score .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
.signals{display:grid;gap:7px;flex:1}
.sigrow{display:grid;grid-template-columns:78px 1fr;gap:9px;align-items:center;font-size:10.5px;color:var(--muted)}
.sigbar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.sigbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--accent))}
.warn{display:flex;gap:10px;align-items:flex-start;background:rgba(255,106,69,.09);border:1px solid rgba(255,106,69,.3);border-radius:9px;padding:11px 13px;font-size:12.5px;color:#ffb9a4;margin-bottom:16px}
.studio-h{display:flex;align-items:center;gap:9px;margin:6px 0 12px}
.studio-h .ln{flex:1;height:1px;background:var(--line)}
.studio-h span{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.nlabel{font-size:11.5px;color:var(--muted);margin-bottom:7px}
.niche-pick{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.npill{flex:1;min-width:90px;text-align:center;padding:9px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.npill:hover{border-color:var(--dim);color:var(--ink)}.npill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gen-btn{width:100%;padding:13px;border:none;border-radius:9px;background:var(--accent);color:var(--accent-d);font-family:inherit;font-weight:700;font-size:14.5px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:9px}
.gen-btn:hover{filter:brightness(1.08)}.gen-btn:disabled{opacity:.55;cursor:wait}
.ad-out{margin-top:16px;display:none}
.ad-card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:18px;position:relative;overflow:hidden}
.ad-card::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(180deg,var(--accent),var(--blue))}
.ad-card .lab{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:5px}
.ad-card .hl{font-family:'Fraunces',serif;font-weight:900;font-size:21px;line-height:1.16;margin-bottom:12px;color:#fff}
.ad-card .desc{font-size:14px;color:var(--ink);line-height:1.5}
.ad-actions{display:flex;gap:8px;margin-top:13px}
.ad-actions button{flex:1;padding:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;font-family:inherit;font-size:12.5px;cursor:pointer}
.ad-actions button:hover{border-color:var(--dim)}
.spinner{width:15px;height:15px;border:2px solid rgba(12,12,14,.3);border-top-color:var(--accent-d);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--coral);font-size:12.5px;margin-top:10px}
.detclose{display:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}::-webkit-scrollbar-track{background:transparent}
@media(max-width:900px){.main{grid-template-columns:1fr}.detail{position:fixed;inset:0;height:100%;z-index:50;border-left:none;transform:translateX(100%);transition:.25s;top:0}.detail.open{transform:none}.detclose{display:flex;position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);align-items:center;justify-content:center;cursor:pointer;font-size:20px;z-index:2}header{padding:18px 18px 12px}.controls{padding:12px 18px}.brand h1{font-size:23px}.status{gap:14px}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>SIGNAL<span class="slash">//</span>DESK</h1>
    <div class="sub">Live virality intelligence · home insurance · refinance · home services</div>
  </div>
  <div class="status">
    <div class="live" id="live" title="Sync now"><span class="dot"></span> <span id="live-l">Live</span></div>
    <div class="stat"><span class="n" id="st-count">0</span><span class="l">Articles</span></div>
    <div class="stat"><span class="n" id="st-next">—</span><span class="l">Next sync</span></div>
    <div class="stat"><span class="n" id="st-time">—</span><span class="l">Last sync</span></div>
  </div>
</header>
<div class="controls">
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" placeholder="Search headlines, sources…" autocomplete="off">
  </div>
  <div class="chips" id="niche-chips"></div>
  <div class="ctl"><span>Sort</span><select id="sort"><option value="vir">Virality ↓</option><option value="fit">Niche fit ↓</option><option value="new">Newest</option></select></div>
  <div class="ctl slider-wrap"><span>Min score</span><input type="range" id="minv" min="0" max="100" value="0"><span class="mono" id="minv-l">0</span></div>
  <div class="toggle" id="hide-sens"><span class="sw"></span> Hide sensitive</div>
</div>
<div class="main">
  <div class="list"><div class="count-line" id="count-line">loading…</div><div id="cards"></div></div>
  <aside class="detail" id="detail">
    <div class="empty" id="empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".5"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
      <div class="big">Select a story</div><div>Pick a headline to see its virality breakdown and generate an ad.</div>
    </div>
    <div id="detail-body" style="display:none"></div>
  </aside>
</div>
<script>
const NICHES=["Home Insurance","Refinance","Home Services"];
const state={niche:"All",sort:"vir",minv:0,q:"",hideSens:false,selKey:null,adNiche:null};
let DATA=[], seenKeys=new Set(), firstLoad=true, hasKey=false;
const scoreColor=s=>s>=75?'var(--accent)':s>=55?'var(--gold)':s>=38?'#cbb98a':'var(--dim)';
const ageStr=iso=>{if(!iso)return'—';const h=(Date.now()-new Date(iso))/36e5;if(h<1)return Math.max(1,Math.round(h*60))+'m';if(h<24)return Math.round(h)+'h';return Math.round(h/24)+'d';};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isNew=iso=>iso&&(Date.now()-new Date(iso))/6e4<35;

async function load(){
  try{
    const r=await fetch('/api/news?limit=500'); const rows=await r.json();
    rows.forEach(d=>d._key=(d.title||'').slice(0,50)+d.domain);
    DATA=rows; render();
  }catch(e){ document.getElementById('count-line').textContent='waiting for first sync…'; }
}
async function status(){
  try{
    const s=await(await fetch('/api/status')).json(); hasKey=s.has_key;
    document.getElementById('st-count').textContent=DATA.length;
    if(s.last_sync) document.getElementById('st-time').textContent=new Date(s.last_sync).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
    const live=document.getElementById('live');
    live.classList.toggle('syncing',s.running);
    document.getElementById('live-l').textContent=s.running?'Syncing':'Live';
    if(s.next_sync){const m=Math.max(0,Math.round((s.next_sync*1000-Date.now())/6e4));document.getElementById('st-next').textContent=m+'m';}
  }catch(e){}
}
function render(){
  let rows=DATA.filter(d=>{
    if(state.niche!=="All"&&d.matched_niche!==state.niche)return false;
    if(state.minv&&d.virality_score<state.minv)return false;
    if(state.hideSens&&d.sensitive)return false;
    if(state.q){const q=state.q.toLowerCase();if(!(d.title.toLowerCase().includes(q)||(d.source||'').toLowerCase().includes(q)))return false;}
    return true;
  });
  rows.sort((a,b)=>state.sort==="fit"?b.niche_fit-a.niche_fit||b.virality_score-a.virality_score:state.sort==="new"?new Date(b.published||0)-new Date(a.published||0):b.virality_score-a.virality_score);
  document.getElementById('count-line').textContent=rows.length+" stories"+(state.niche!=="All"?" · "+state.niche:"")+" · updates every 30 min";
  const c=document.getElementById('cards');c.innerHTML='';
  rows.forEach(d=>{
    const niche=NICHES.includes(d.matched_niche);
    const fresh=!firstLoad&&!seenKeys.has(d._key);
    const el=document.createElement('div');
    el.className='card'+(d._key===state.selKey?' sel':'')+(fresh?' fresh':'');
    el.onclick=()=>select(d._key);
    el.innerHTML=`<div class="scorebox"><div class="score" style="color:${scoreColor(d.virality_score)}">${Math.round(d.virality_score)}</div><div class="bar"><i style="width:${d.virality_score}%;background:${scoreColor(d.virality_score)}"></i></div><div class="slab">viral</div></div>
      <div><h3>${esc(d.title)}</h3><div class="meta"><span class="src">${esc(d.source||d.domain||'—')}</span><span class="cat">${esc(d.category)}</span><span>${ageStr(d.published)}</span>
      ${isNew(d.first_seen)?'<span class="tag new">● new</span>':''}
      <span class="tag ${niche?'niche':'gen'}">${esc(d.matched_niche)}</span>${niche?`<span class="tag fit">fit ${d.niche_fit}</span>`:''}${d.sensitive?'<span class="tag sens">⚠ sensitive</span>':''}</div></div>`;
    c.appendChild(el);
  });
  if(!rows.length)c.innerHTML='<div style="padding:50px 14px;color:var(--dim);text-align:center">No stories match these filters.</div>';
  DATA.forEach(d=>seenKeys.add(d._key)); firstLoad=false;
  document.getElementById('st-count').textContent=DATA.length;
}
const SIGLABEL={emotion:'Emotion',curiosity:'Curiosity',controversy:'Conflict',timeliness:'Timeliness',utility:'Utility',concreteness:'Concrete',sentiment:'Sentiment',reach:'Reach',structure:'Structure'};
function select(key){
  state.selKey=key; const d=DATA.find(x=>x._key===key); if(!d)return;
  state.adNiche=NICHES.includes(d.matched_niche)?d.matched_niche:"Home Insurance";
  document.getElementById('empty').style.display='none';
  const b=document.getElementById('detail-body');b.style.display='block';
  const sigs=Object.keys(SIGLABEL).map(k=>`<div class="sigrow"><span>${SIGLABEL[k]}</span><div class="sigbar"><i style="width:${(d.breakdown&&d.breakdown[k])||0}%"></i></div></div>`).join('');
  b.innerHTML=`<button class="detclose" onclick="document.getElementById('detail').classList.remove('open')">×</button>
    <div class="d-kicker">Selected story</div><h2>${esc(d.title)}</h2>
    <div class="d-meta"><span class="src" style="color:var(--ink);font-weight:600">${esc(d.source||d.domain)}</span> · <span>${esc(d.category)}</span> · <span>${ageStr(d.published)} ago</span></div>
    <div class="d-score"><div><div class="big" style="color:${scoreColor(d.virality_score)}">${Math.round(d.virality_score)}</div><div class="lbl">virality / 100</div></div><div class="signals">${sigs}</div></div>
    ${d.sensitive?'<div class="warn"><span>⚠</span><div><b>Brand-safety flag.</b> This story touches tragedy/violence/loss. Newsjacking it risks backlash — review carefully or skip.</div></div>':''}
    <div class="studio-h"><span>Ad Studio</span><div class="ln"></div></div>
    <div class="nlabel">Angle this story toward:</div><div class="niche-pick" id="niche-pick"></div>
    <button class="gen-btn" id="genbtn" onclick="generate()">✦ Generate ad copy</button>
    <div class="ad-out" id="ad-out"></div>`;
  paintNiche();
  if(window.innerWidth<=900)document.getElementById('detail').classList.add('open');
  render();
}
function paintNiche(){const w=document.getElementById('niche-pick');w.innerHTML='';NICHES.forEach(n=>{const p=document.createElement('div');p.className='npill'+(state.adNiche===n?' on':'');p.textContent=n;p.onclick=()=>{state.adNiche=n;paintNiche();};w.appendChild(p);});}
async function generate(){
  const d=DATA.find(x=>x._key===state.selKey);const btn=document.getElementById('genbtn');const out=document.getElementById('ad-out');
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Writing…';out.style.display='block';out.innerHTML='';
  try{
    const res=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({niche:state.adNiche,article:{title:d.title,source:d.source,domain:d.domain,category:d.category,sensitive:d.sensitive}})});
    const ad=await res.json();
    if(ad.error)throw new Error(ad.error);
    out.innerHTML=`<div class="ad-card"><div class="lab">${esc(state.adNiche)} · newsjack</div><div class="hl">${esc(ad.headline)}</div><div class="desc">${esc(ad.description)}</div>
      <div class="ad-actions"><button onclick="generate()">↻ Regenerate</button><button onclick="navigator.clipboard&&navigator.clipboard.writeText(${JSON.stringify(JSON.stringify('')).slice(0,0)}'')">⧉ Copy</button></div></div>`;
    document.querySelector('.ad-actions button:last-child').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(ad.headline+' — '+ad.description);
  }catch(e){
    out.innerHTML=`<div class="err">${esc(String(e.message||e))}${!hasKey?' — set a free GROQ_API_KEY (console.groq.com) and restart the server to enable ad generation.':''}</div>`;
  }
  btn.disabled=false;btn.innerHTML='✦ Generate ad copy';
}
(function(){
  const ch=document.getElementById('niche-chips');
  ["All",...NICHES,"General (bridge needed)"].forEach(n=>{const c=document.createElement('div');c.className='chip'+(n==="All"?' on':'');c.textContent=n==="General (bridge needed)"?"General":n;c.onclick=()=>{state.niche=n;[...ch.children].forEach(x=>x.classList.remove('on'));c.classList.add('on');render();};ch.appendChild(c);});
  document.getElementById('q').oninput=e=>{state.q=e.target.value;render();};
  document.getElementById('sort').onchange=e=>{state.sort=e.target.value;render();};
  document.getElementById('minv').oninput=e=>{state.minv=+e.target.value;document.getElementById('minv-l').textContent=e.target.value;render();};
  document.getElementById('hide-sens').onclick=function(){state.hideSens=!state.hideSens;this.classList.toggle('on');render();};
  document.getElementById('live').onclick=async()=>{await fetch('/api/sync',{method:'POST'});setTimeout(()=>{load();status();},2500);};
  load();status();
  setInterval(load,60000);     // pull new stories every 60s
  setInterval(status,15000);   // refresh sync clock
})();
</script>
</body>
</html>
